<!DOCTYPE html>
<html lang="es" data-look="luz">
<head>

<meta property="og:title" content="Jesús Levanta Las Manos | Propuesta de sitio web">
<meta property="og:description" content="Tres diseños para su nuevo sitio web. Elija el diseño y los colores que más le gusten.">
<meta property="og:image" content="https://www.finessemedia.pro/proposals/jesus-levanta-las-manos/images/share.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Mrs+Saint+Delafield&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">

<body>

<!-- Finesse Media proposal chrome (not part of the church site) -->
<div class="intro">
  <div class="intro-in">
    <a class="intro-brand" href="https://finessemedia.pro" target="_blank" rel="noopener">Finesse Media LLC</a>
    <p class="intro-text" id="introText"></p>
  </div>
</div>
<div class="picker" id="picker">
  <div class="picker-looks" role="tablist" aria-label="Looks">
    <button type="button" role="tab" data-pick="luz"><b>1</b> Luz</button>
    <button type="button" role="tab" data-pick="fuego"><b>2</b> Fuego</button>
    <button type="button" role="tab" data-pick="calle"><b>3</b> Calle</button>
  </div>
  <div class="picker-bottom">
    <div class="picker-pals" id="pickerPalettes"></div>
    <button type="button" class="picker-want" data-want id="pickerWant"></button>
  </div>
</div>

<!-- Church site: every section below is rendered from the CONTENT object in js/site.js (Finesse OS ready) -->
<div class="site" id="site"></div>

<!-- Finesse Media: choose this design + contact -->
<section class="choose" id="choose">
  <div class="choose-in">
    <p class="choose-eyebrow" id="chooseEyebrow"></p>
    <h2 class="choose-title" id="chooseTitle"></h2>
    <p class="choose-pick" id="choosePick"></p>
    <div class="choose-btns">
      <a class="choose-btn wa" id="chooseWa" target="_blank" rel="noopener"></a>
      <a class="choose-btn sms" id="chooseSms"></a>
    </div>
    <p class="choose-note" id="chooseNote"></p>
    <div class="choose-contact">
      <strong>Finesse Media LLC</strong>
      <span>Angel Gerena, Creative Director</span>
      <a href="tel:+14079609004">(407) 960-9004</a>
      <a href="mailto:angel@finessemedia.pro">angel@finessemedia.pro</a>
      <a href="https://finessemedia.pro" target="_blank" rel="noopener">finessemedia.pro</a>
    </div>
  </div>
</section>

<script src="js/site.js"></script>
</body>
</html>
