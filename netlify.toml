[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Intended routing (top-to-bottom, first match wins):
#   1) /admin/*  -> admin SPA shell (React Router handles the sub-route)
#   2) /*        -> public static site
#
# NOTE: this site currently has a legacy *site-level* redirect (/* -> /index.html,
# created via the Netlify API before the admin moved under /admin/) that is
# evaluated BEFORE netlify.toml and overrides these rules. Until that site-level
# redirect is removed, admin sub-routes are handled instead by pre-generated
# static shells (dist/admin/<route>/index.html, produced by scripts/gen-admin-routes.mjs),
# which are real files and therefore resolve before any redirect. Once the
# site-level redirect is deleted, the rules below become authoritative on their own.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---- Public site headers (added with the 2026-09-28 site rebuild) ----

# Pages always check for a newer version, so a fresh deploy shows up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Private price guides: keep them out of search engines.
[[headers]]
  for = "/guides/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"

# ---- Speed pass: browser caching (Mario, 2026-10-10) ----
# Netlify's default makes browsers re-check every file on every visit.
# Photos, posters and films: keep for a week. When you swap an image, give it a new
# file name (or a ?v= tag) and visitors get it right away.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Stylesheets and scripts: keep for a day. The main pages load them with ?v= tags,
# so bumping the tag on a deploy always delivers the new version.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/themes.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/finesse-os.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/os-showcase.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/palette-data.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/themes.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/website-portfolio.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/website-projects.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Admin portal build files have content hashes in their names, so they never go stale.
[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
